#
# Runs the tests and the release-zip build in Windows PowerShell 5.1 and in PowerShell 7, each leg
# entirely in its own PowerShell. On a version tag (v2.0.0), builds the release zip with its SHA-256
# checksum and publishes a GitHub release with both files.
name: tests

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      # A step's shell can't come from the matrix, so each leg has its own pair of steps. The harness, its
      # in-process checks and the collector it starts all run in that leg's PowerShell.
      - name: Tests (Windows PowerShell 5.1)
        if: matrix.shell == 'powershell'
        shell: powershell
        run: ./tests/Test-Collector.ps1 -Shell powershell
      - name: Release zip builds (Windows PowerShell 5.1)
        if: matrix.shell == 'powershell'
        shell: powershell
        run: ./build_release.ps1
      - name: Tests (PowerShell 7)
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: ./tests/Test-Collector.ps1 -Shell pwsh
      - name: Release zip builds (PowerShell 7, as the release job)
        if: matrix.shell == 'pwsh'
        shell: pwsh
        run: ./build_release.ps1

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Build the release zip and checksum
        shell: pwsh
        run: ./build_release.ps1 -Tag "$env:GITHUB_REF_NAME"
      - name: Publish the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$env:GITHUB_REF_NAME" (Get-ChildItem dist/*.zip).FullName (Get-ChildItem dist/*.sha256).FullName
          --title "sf-log-collector $($env:GITHUB_REF_NAME.TrimStart('v'))"
          --notes-file build/release-notes.md
          --verify-tag
