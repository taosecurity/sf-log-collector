#
# Runs the tests in Windows PowerShell 5.1 and PowerShell 7. On a version tag (v2.0.0), builds the
# release zip with its SHA-256 checksum and publishes a GitHub release with both files.
name: tests

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        shell: [powershell, pwsh]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      # A step's shell can't come from the matrix: the harness runs in pwsh and starts the collector in
      # the matrix's PowerShell (powershell = Windows PowerShell 5.1, pwsh = PowerShell 7).
      - name: Tests
        shell: pwsh
        run: ./tests/Test-Collector.ps1 -Shell ${{ matrix.shell }}
      - name: Release zip builds (Windows PowerShell 5.1)
        shell: powershell
        run: ./build_release.ps1

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Build the release zip and checksum
        shell: pwsh
        run: ./build_release.ps1 -Tag "$env:GITHUB_REF_NAME"
      - name: Publish the GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$env:GITHUB_REF_NAME" (Get-ChildItem dist/*.zip).FullName (Get-ChildItem dist/*.sha256).FullName
          --title "sf-log-collector $($env:GITHUB_REF_NAME.TrimStart('v'))"
          --notes-file build/release-notes.md
          --verify-tag
